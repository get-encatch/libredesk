env:
  - GO111MODULE=on
  - CGO_ENABLED=0
  # encatch: publish to our fork's GHCR only (no Docker Hub).
  - GITHUB_ORG=get-encatch

before:
  hooks:
    - go mod tidy
    - make frontend-build

builds:
  - id: "universal"
    main: ./cmd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - freebsd
      - linux
      - netbsd
      - openbsd
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    binary: libredesk
    ldflags:
      - -s -w -X "main.buildString={{ .Tag }} ({{ .ShortCommit }} {{ .Date }}, {{ .Os }}/{{ .Arch }})" -X "main.versionString={{ .Tag }}"
    hooks:
      post: make stuff BIN={{ .Path }}

archives:
  - format: tar.gz
    name_template: 'libredesk_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if eq .Arch "arm" }}v{{ .Arm }}{{ end }}'
    files:
      - config.sample.toml
      - README.md
      - LICENSE

checksum:
  name_template: "libredesk_{{ .Version }}_checksums.txt"

source:
  enabled: true
  format: tar.gz
  name_template: "libredesk_{{ .Version }}_source"

# encatch: we only ship linux/amd64 images, so a single image is pushed
# directly under the final tags (no per-arch images or manifests).
dockers:
  - use: buildx
    goos: linux
    goarch: amd64
    ids:
      - universal
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:latest"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:{{ .Tag }}"
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile
    extra_files:
      - config.sample.toml

release:
  github:
    owner: get-encatch
    name: libredesk
  # encatch: vX.Y.Z-encatch.N tags are our releases, not pre-releases.
  prerelease: false
  draft: true
