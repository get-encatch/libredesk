{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} · Encatch Support</title>
<link rel="preload" href="/static/public/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/public/static/fonts.css">
<link rel="stylesheet" href="/my-tickets/assets/app.css?v={{assetVersion}}">
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-10 border-b bg-background">
  <div class="mx-auto flex max-w-3xl flex-wrap items-center justify-between gap-3 px-4 py-3">
    <a href="/my-tickets" class="flex items-center gap-2.5 text-foreground">
      <picture>
        <source srcset="/my-tickets/assets/logo-dark.png?v={{assetVersion}}" media="(prefers-color-scheme: dark)">
        <img src="/my-tickets/assets/logo-light.svg?v={{assetVersion}}" alt="Encatch" class="h-6 w-auto" width="125" height="24">
      </picture>
      <span class="border-l pl-2.5 text-sm font-medium text-muted-foreground">Support</span>
    </a>
    {{with .S}}<div class="flex flex-wrap items-center gap-3 text-sm text-muted-foreground">
      <span>{{.Name}} · {{.OrgName}}</span>
      <form method="post" action="/my-tickets/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="btn btn-outline btn-sm" type="submit">Sign out</button></form>
    </div>{{end}}
  </div>
</header>
<main class="mx-auto max-w-3xl px-4 pb-16 pt-8">
{{end}}

{{define "foot"}}</main>
</body>
</html>
{{end}}

{{define "status"}}<span class="badge {{if eq . "Waiting on you"}}badge-waiting{{else if eq . "Resolved"}}badge-resolved{{else}}badge-open{{end}}">{{.}}</span>{{end}}
