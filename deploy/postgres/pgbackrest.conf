[global]
# repo1: local disk (bind-mounted from ./backups/pgbackrest on the host).
repo1-path=/var/lib/pgbackrest
# Keep the last 5 weekly full backups (28-35 days restorable). Differential and
# incremental backups and archived WAL expire together with their full backup.
repo1-retention-full-type=count
repo1-retention-full=5

# repo2 (later): S3-compatible object storage. Uncomment and fill in; existing
# schedules then back up to both repos.
# repo2-type=s3
# repo2-path=/libredesk
# repo2-s3-bucket=<bucket>
# repo2-s3-endpoint=s3.ap-south-1.amazonaws.com
# repo2-s3-region=ap-south-1
# repo2-s3-key=<access key>
# repo2-s3-key-secret=<secret key>
# repo2-cipher-type=aes-256-cbc
# repo2-cipher-pass=<long random passphrase>
# repo2-retention-full-type=count
# repo2-retention-full=5

compress-type=zst
compress-level=3
process-max=2
start-fast=y
# Async archiving: WAL is queued locally and pushed in batches.
archive-async=y
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[libredesk]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
