<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Encatch Support</title>
	<style>
		:root { --bg: #f7f7f8; --card: #fff; --text: #18181b; --muted: #52525b; --accent: #2d6a4f; --border: #e4e4e7; }
		@media (prefers-color-scheme: dark) {
			:root { --bg: #111113; --card: #1c1c1f; --text: #f4f4f5; --muted: #a1a1aa; --accent: #74c69d; --border: #2e2e33; }
		}
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
			background: var(--bg); color: var(--text);
			font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
		main { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--border);
			border-radius: 12px; padding: 32px 28px; }
		h1 { margin: 0 0 12px; font-size: 22px; }
		p { margin: 0 0 14px; color: var(--muted); }
		a { color: var(--accent); }
		.cta { margin-top: 20px; font-size: 14px; }
	</style>
</head>
<body>
	<main>
		<h1>Encatch Support</h1>
		<p>To view your tickets or raise a new one, open <strong>Support</strong> from your Encatch dashboard.</p>
		<p>You can also email us at <a href="mailto:support@encatch.com">support@encatch.com</a>.</p>
		<p class="cta"><a href="https://encatch.com">Go to encatch.com &rarr;</a></p>
	</main>
</body>
</html>
